  <rect x="536" y="388" width="26" height="26" rx="7" fill="#FFD100" fill-opacity="0.15"/>
  <text x="540" y="406" fill="#FACC15" font-size="11" font-family="system-ui,sans-serif" font-weight="800">EN</text>
  <text x="574" y="402" fill="#CBD5E1" font-size="12" font-family="system-ui,sans-serif">Bilingual: English + Setswana</text>

  <rect x="520" y="435" width="300" height="50" rx="12" fill="#0E2D52" stroke="#1A3D6B" stroke-opacity="0.3"/>
  <rect x="536" y="448" width="26" height="26" rx="7" fill="#FFFFFF" fill-opacity="0.05"/>
  <text x="543" y="466" fill="#94A3B8" font-size="12" font-family="system-ui,sans-serif" font-weight="800">@</text>
