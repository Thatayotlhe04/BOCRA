  <text x="78" y="396" fill="#CBD5E1" font-size="12" font-family="system-ui,sans-serif">Type Approval is BOCRA's process for</text>
  <text x="78" y="414" fill="#CBD5E1" font-size="12" font-family="system-ui,sans-serif">certifying telecom equipment before it</text>
  <text x="78" y="432" fill="#CBD5E1" font-size="12" font-family="system-ui,sans-serif">can be sold or used in Botswana.</text>

