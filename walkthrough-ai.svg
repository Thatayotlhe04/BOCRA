  <rect x="920" y="390" width="210" height="72" rx="12" fill="#0077B6" fill-opacity="0.08" stroke="#0077B6" stroke-opacity="0.2"/>
  <text x="948" y="418" fill="#60A5FA" font-size="12" font-family="system-ui,sans-serif" font-weight="700">Powered by Gemini</text>
