<svg width="1440" height="920" viewBox="0 0 1440 920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BOCRA hero functionality demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030712"/>
      <stop offset="1" stop-color="#0B2447"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="920" fill="url(#bg)"/>
  <text x="90" y="110" fill="#F8FAFC" font-size="62" font-family="Inter,Segoe UI,Arial" font-weight="700">How BOCRA Works in One Glance</text>
  <text x="90" y="160" fill="#93C5FD" font-size="30" font-family="Inter,Segoe UI,Arial">File complaints, track progress, and get instant answers from BOCRA AI.</text>

  <rect x="90" y="215" width="1260" height="395" rx="24" fill="#020617" stroke="#1E3A8A"/>
  <rect x="90" y="215" width="1260" height="70" rx="24" fill="#0F172A"/>
  <circle cx="130" cy="250" r="10" fill="#F87171"/>
  <circle cx="160" cy="250" r="10" fill="#FBBF24"/>
  <circle cx="190" cy="250" r="10" fill="#34D399"/>
  <text x="240" y="258" fill="#64748B" font-size="28" font-family="JetBrains Mono,Consolas,monospace">~/bocra/hero-flow</text>
  <text x="1120" y="258" fill="#FACC15" font-size="24" font-family="JetBrains Mono,Consolas,monospace">LIVE DEMO</text>

  <text x="130" y="340" fill="#E2E8F0" font-size="35" font-family="JetBrains Mono,Consolas,monospace">&gt; Citizen starts on homepage task search</text>
  <rect x="130" y="370" width="210" height="44" rx="6" fill="#BBF7D0"/>
  <text x="145" y="400" fill="#14532D" font-size="30" font-family="JetBrains Mono,Consolas,monospace">STEP 01</text>
  <text x="370" y="400" fill="#94A3B8" font-size="34" font-family="JetBrains Mono,Consolas,monospace">File a complaint in 4 guided steps</text>

  <rect x="130" y="430" width="210" height="44" rx="6" fill="#BFDBFE"/>
  <text x="145" y="460" fill="#1E3A8A" font-size="30" font-family="JetBrains Mono,Consolas,monospace">STEP 02</text>
  <text x="370" y="460" fill="#94A3B8" font-size="34" font-family="JetBrains Mono,Consolas,monospace">Track status updates in real time</text>

  <rect x="130" y="490" width="210" height="44" rx="6" fill="#FBCFE8"/>
  <text x="145" y="520" fill="#9D174D" font-size="30" font-family="JetBrains Mono,Consolas,monospace">STEP 03</text>
  <text x="370" y="520" fill="#94A3B8" font-size="34" font-family="JetBrains Mono,Consolas,monospace">Ask BOCRA AI in English or Setswana</text>

  <rect x="90" y="660" width="405" height="180" rx="20" fill="#0F172A" stroke="#1D4ED8"/>
  <text x="125" y="715" fill="#F8FAFC" font-size="33" font-family="Inter,Segoe UI,Arial" font-weight="700">1) File Complaint</text>
  <text x="125" y="760" fill="#93C5FD" font-size="25" font-family="Inter,Segoe UI,Arial">Provider, issue, evidence, review.</text>

  <rect x="517" y="660" width="405" height="180" rx="20" fill="#0F172A" stroke="#16A34A"/>
  <text x="552" y="715" fill="#F8FAFC" font-size="33" font-family="Inter,Segoe UI,Arial" font-weight="700">2) Live Tracking</text>
  <text x="552" y="760" fill="#86EFAC" font-size="25" font-family="Inter,Segoe UI,Arial">Progress bar + timeline visibility.</text>

  <rect x="945" y="660" width="405" height="180" rx="20" fill="#0F172A" stroke="#E11D48"/>
  <text x="980" y="715" fill="#F8FAFC" font-size="33" font-family="Inter,Segoe UI,Arial" font-weight="700">3) BOCRA AI</text>
  <text x="980" y="760" fill="#FDA4AF" font-size="25" font-family="Inter,Segoe UI,Arial">Instant regulatory assistance 24/7.</text>
