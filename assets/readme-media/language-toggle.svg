<svg width="900" height="1800" viewBox="0 0 900 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Language toggle in iPhone 17 Pro Max mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0B2447"/>
    </linearGradient>
  </defs>

  <rect width="900" height="1800" fill="url(#bg)"/>
  <rect x="170" y="70" width="560" height="1660" rx="78" fill="#111827" stroke="#94A3B8" stroke-width="6"/>
  <rect x="205" y="130" width="490" height="1540" rx="58" fill="#0B2A4D"/>
  <rect x="360" y="102" width="180" height="24" rx="12" fill="#1F2937"/>

  <text x="250" y="230" fill="white" font-size="34" font-family="Inter,Segoe UI,Arial" font-weight="700">Accessibility Settings</text>
  <text x="250" y="275" fill="#93C5FD" font-size="23" font-family="Inter,Segoe UI,Arial">Switch language instantly for better access</text>

  <rect x="245" y="350" width="410" height="220" rx="28" fill="#102A52" stroke="#3B82F6"/>
  <text x="275" y="415" fill="#E2E8F0" font-size="30" font-family="Inter,Segoe UI,Arial" font-weight="700">Language / Puo</text>

  <rect x="275" y="455" width="170" height="74" rx="37" fill="#1E3A8A"/>
  <text x="360" y="502" text-anchor="middle" fill="white" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">English</text>

  <rect x="455" y="455" width="170" height="74" rx="37" fill="#E11D48"/>
  <text x="540" y="502" text-anchor="middle" fill="white" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">Setswana</text>

  <rect x="245" y="630" width="410" height="230" rx="24" fill="#F8FAFC"/>
  <text x="275" y="690" fill="#0F172A" font-size="31" font-family="Inter,Segoe UI,Arial" font-weight="700">Homepage Copy Preview</text>
  <text x="275" y="735" fill="#334155" font-size="22" font-family="Inter,Segoe UI,Arial">EN: What do you need help with today?</text>
  <text x="275" y="775" fill="#334155" font-size="22" font-family="Inter,Segoe UI,Arial">TN: O tlhoka thuso ka eng gompieno?</text>
  <text x="275" y="820" fill="#0F766E" font-size="21" font-family="Inter,Segoe UI,Arial">✓ Instant switch with no page reload</text>

  <rect x="245" y="920" width="410" height="260" rx="24" fill="#FDF2F8"/>
  <text x="275" y="980" fill="#9D174D" font-size="30" font-family="Inter,Segoe UI,Arial" font-weight="700">Why this matters</text>
  <text x="275" y="1030" fill="#475569" font-size="22" font-family="Inter,Segoe UI,Arial">• Citizens can use services in their</text>
  <text x="275" y="1066" fill="#475569" font-size="22" font-family="Inter,Segoe UI,Arial">  preferred language.</text>
  <text x="275" y="1102" fill="#475569" font-size="22" font-family="Inter,Segoe UI,Arial">• Reduces confusion in complaints</text>
  <text x="275" y="1138" fill="#475569" font-size="22" font-family="Inter,Segoe UI,Arial">  and licensing workflows.</text>

  <text x="450" y="1440" text-anchor="middle" fill="#CBD5E1" font-size="28" font-family="Inter,Segoe UI,Arial" font-weight="700">iPhone 17 Pro Max Mockup</text>
  <text x="450" y="1480" text-anchor="middle" fill="#93C5FD" font-size="23" font-family="Inter,Segoe UI,Arial">English / Setswana toggle showcase</text>
</svg>
