  <text x="70" y="382" fill="#BFDBFE" font-size="27" font-family="Inter,Segoe UI,Arial">regulatory guidance and service discovery.</text>

  <rect x="70" y="430" width="330" height="64" rx="32" fill="#E11D48"/>
