<svg width="900" height="1800" viewBox="0 0 900 1800" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BOCRA AI chatbot in iPhone 17 Pro Max mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
