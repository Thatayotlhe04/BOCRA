<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://bocra-theta.vercel.app/" />
    <title>BOCRA Web Platform</title>
    <meta
      name="description"
      content="Redirecting to the BOCRA Web Platform landing page."
    />
    <link rel="canonical" href="https://bocra-theta.vercel.app/" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        max-width: 36rem;
        border-radius: 1.5rem;
        background: white;
        padding: 2rem;
        box-shadow: 0 20px 60px rgb(15 23 42 / 12%);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1;
      }

      p {
        margin: 0 0 1.5rem;
        color: #475569;
      }

      a {
        display: inline-flex;
        border-radius: 999px;
        background: #0f766e;
        color: white;
        padding: 0.875rem 1.25rem;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #115e59;
      }
    </style>
    <script>
      window.location.replace("https://bocra-theta.vercel.app/");
    </script>
  </head>
  <body>
    <main aria-labelledby="page-title">
      <h1 id="page-title">BOCRA Web Platform</h1>
      <p>
        Redirecting from GitHub Pages to the BOCRA landing page. If you are not
        redirected automatically, use the button below.
      </p>
      <a href="https://bocra-theta.vercel.app/">Open the landing page</a>
    </main>
  </body>
</html>
