    <text x="460" y="512" fill="#FFFFFF" font-size="7" font-family="system-ui,sans-serif" font-weight="600">Telecom</text>
    <rect x="524" y="472" width="74" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="546" cy="490" r="8" fill="#00A651" fill-opacity="0.15"/>
