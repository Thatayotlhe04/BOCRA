  <!-- Inner bezel -->
  <rect x="426" y="38" width="348" height="644" rx="42" fill="#111111"/>

  <!-- Screen content -->
  <g clip-path="url(#scr)">
    <!-- Page background -->
    <rect x="432" y="68" width="336" height="584" fill="#ECEEF1"/>

    <!-- ── Header bar ── -->
    <rect x="432" y="68" width="336" height="48" fill="#0C2340"/>
    <rect x="432" y="116" width="336" height="3" fill="#FFD100"/>
    <!-- Brand dots -->
