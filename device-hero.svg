  <text x="840" y="180" fill="#FFFFFF" font-size="13" font-family="system-ui,sans-serif" font-weight="700" letter-spacing="1.5" fill-opacity="0.3">BUILT WITH</text>

  <rect x="840" y="200" width="108" height="34" rx="10" fill="#000000" stroke="#333333"/>
  <text x="866" y="222" fill="#FFFFFF" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Next.js 14</text>

  <rect x="958" y="200" width="108" height="34" rx="10" fill="#3ECF8E" fill-opacity="0.1" stroke="#3ECF8E" stroke-opacity="0.25"/>
  <text x="980" y="222" fill="#3ECF8E" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Supabase</text>

  <rect x="840" y="244" width="108" height="34" rx="10" fill="#3178C6" fill-opacity="0.1" stroke="#3178C6" stroke-opacity="0.25"/>
  <text x="854" y="266" fill="#60A5FA" font-size="13" font-family="system-ui,sans-serif" font-weight="600">TypeScript</text>

  <rect x="958" y="244" width="108" height="34" rx="10" fill="#06B6D4" fill-opacity="0.1" stroke="#06B6D4" stroke-opacity="0.25"/>
  <text x="975" y="266" fill="#22D3EE" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Tailwind</text>

  <rect x="840" y="288" width="226" height="34" rx="10" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="905" y="310" fill="#94A3B8" font-size="13" font-family="system-ui,sans-serif" font-weight="600">Deployed on Vercel ▲</text>

  <!-- Bottom tagline -->
  <text x="840" y="380" fill="#475569" font-size="14" font-family="system-ui,sans-serif">73% of Batswana access the web</text>
  <text x="840" y="402" fill="#475569" font-size="14" font-family="system-ui,sans-serif">on their phones.</text>
  <text x="840" y="434" fill="#64748B" font-size="14" font-family="system-ui,sans-serif" font-weight="600">This was built for them first.</text>
