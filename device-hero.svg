  <text x="98" y="420" fill="#FFFFFF" font-size="15" font-family="system-ui,sans-serif" font-weight="700">Open Live Demo →</text>

  <!-- Stat pills -->
  <rect x="52" y="480" width="120" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="72" y="504" fill="#FFD100" font-size="20" font-family="system-ui,sans-serif" font-weight="800">98%</text>
  <text x="72" y="524" fill="#475569" font-size="11" font-family="system-ui,sans-serif">Resolved</text>

  <rect x="184" y="480" width="120" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="204" y="504" fill="#00A651" font-size="20" font-family="system-ui,sans-serif" font-weight="800">6 days</text>
  <text x="204" y="524" fill="#475569" font-size="11" font-family="system-ui,sans-serif">Avg. resolve</text>

  <rect x="316" y="480" width="80" height="56" rx="12" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.06"/>
  <text x="336" y="504" fill="#0077B6" font-size="20" font-family="system-ui,sans-serif" font-weight="800">2</text>
  <text x="336" y="524" fill="#475569" font-size="11" font-family="system-ui,sans-serif">Languages</text>

