  <!-- Left text block -->
  <text x="52" y="220" fill="#FFFFFF" font-size="46" font-family="system-ui,sans-serif" font-weight="800" letter-spacing="-1">BOCRA</text>
  <text x="52" y="270" fill="#FFFFFF" font-size="46" font-family="system-ui,sans-serif" font-weight="800" letter-spacing="-1">Digital Platform</text>
  <text x="52" y="325" fill="#64748B" font-size="18" font-family="system-ui,sans-serif" font-weight="400">Citizen-centric regulatory services</text>
  <text x="52" y="352" fill="#64748B" font-size="18" font-family="system-ui,sans-serif" font-weight="400">for Botswana — reimagined.</text>

  <!-- CTA button -->
