    <text x="476" y="555" fill="#FFD100" font-size="16" font-family="system-ui,sans-serif" font-weight="800">2,450+</text>
    <text x="476" y="568" fill="#FFFFFF" fill-opacity="0.25" font-size="6" font-family="system-ui,sans-serif" letter-spacing="0.8">LICENSES</text>
    <text x="572" y="555" fill="#00A651" font-size="16" font-family="system-ui,sans-serif" font-weight="800">98%</text>
    <text x="572" y="568" fill="#FFFFFF" fill-opacity="0.25" font-size="6" font-family="system-ui,sans-serif" letter-spacing="0.8">RESOLVED</text>
    <text x="650" y="555" fill="#0077B6" font-size="16" font-family="system-ui,sans-serif" font-weight="800">1,200+</text>
    <text x="650" y="568" fill="#FFFFFF" fill-opacity="0.25" font-size="6" font-family="system-ui,sans-serif" letter-spacing="0.8">DEVICES</text>

    <!-- ── BOCRA AI FAB ── -->
