    <rect x="604" y="472" width="74" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="626" cy="490" r="8" fill="#E31B6D" fill-opacity="0.15"/>
    <text x="624" y="512" fill="#FFFFFF" font-size="7" font-family="system-ui,sans-serif" font-weight="600">Postal</text>
    <rect x="684" y="472" width="74" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="706" cy="490" r="8" fill="#FFD100" fill-opacity="0.15"/>
    <text x="694" y="512" fill="#FFFFFF" font-size="7" font-family="system-ui,sans-serif" font-weight="600">Internet</text>

