<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060E1A"/>
      <stop offset="1" stop-color="#0C2340"/>
    </linearGradient>
    <clipPath id="scr"><rect x="432" y="68" width="336" height="584" rx="6"/></clipPath>
    <linearGradient id="heroGrad" x1="432" y1="120" x2="768" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C2340"/><stop offset="1" stop-color="#0A4568"/>
    </linearGradient>
    <linearGradient id="sectorGrad" x1="432" y1="446" x2="768" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1F38"/><stop offset="1" stop-color="#0C2340"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#hbg)"/>
  <!-- Ambient glow -->
  <ellipse cx="600" cy="360" rx="340" ry="280" fill="#0077B6" fill-opacity="0.035"/>
